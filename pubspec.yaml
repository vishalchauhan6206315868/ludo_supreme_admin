name: ludo_supreme_admin
description: LudoSupreme Admin Panel (Flutter)
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  fl_chart: ^0.68.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/admin_logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/admin_logo.png"
  windows:
    generate: true
    image_path: "assets/icons/admin_logo.png"
  linux:
    generate: true
    image_path: "assets/icons/admin_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
